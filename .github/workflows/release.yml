name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag phiên bản cần phát hành (VD: v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Mã Nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Thiết Lập Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Thiết Lập Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Cài Đặt Thư Viện (Pub Get)
        run: flutter pub get

      - name: Chạy Kiểm Thử (Unit & Widget Tests)
        run: flutter test

      - name: Biên Dịch Release APK
        run: flutter build apk --release

      - name: Đổi Tên File APK Đính Kèm
        id: prepare_apk
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="latest"
          fi
          APK_NAME="maishop-plus-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${APK_NAME}"
          echo "apk_path=build/app/outputs/flutter-apk/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Tạo & Xuất Bản GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.release_tag }}
          name: "MaiShop Plus ${{ steps.prepare_apk.outputs.release_tag }}"
          files: |
            ${{ steps.prepare_apk.outputs.apk_path }}
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
